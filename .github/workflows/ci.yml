name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install --index-url https://pypi.org/simple -e "packages/agent_core[dev,cli]"
      - run: ruff check --config pyproject.toml packages/agent_core/src packages/agent_core/tests
      - run: mypy --config-file pyproject.toml packages/agent_core/src
      - run: pytest -q packages/agent_core/tests --cov=zhixiao_agent --cov-report=xml
      - name: Smoke test CLI help, version, and machine output
        shell: bash
        run: |
          set -euo pipefail
          zhixiao --help >/dev/null
          zhixiao run --help >/dev/null
          zhixiao version | grep -E '^zhixiao [^ ]+ \(protocol [^ ]+\)$'

          smoke_workspace="$(mktemp -d)"
          zhixiao plugins doctor --workspace "$smoke_workspace"
          zhixiao run "Inspect this workspace without modifying it" \
            --workspace "$smoke_workspace" \
            --offline \
            --permission read_only \
            --approval-policy never \
            --output-format json \
            --events none >cli-smoke.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("cli-smoke.json").read_text(encoding="utf-8"))
          assert payload["schema_version"]
          assert payload["run_id"]
          assert payload["status"] == "succeeded"
          assert payload["verification"]["outcome"] == "skipped"
          assert payload["termination_reason"] == "completed"
          assert isinstance(payload["usage"], dict)
          assert isinstance(payload["budgets"], dict)
          PY

          zhixiao run "Inspect this workspace without modifying it" \
            --workspace "$smoke_workspace" \
            --offline \
            --permission read_only \
            --approval-policy never \
            --output-format jsonl \
            --events jsonl >cli-smoke.jsonl
          python - <<'PY'
          import json
          from pathlib import Path

          events = [
              json.loads(line)
              for line in Path("cli-smoke.jsonl").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          assert events
          assert events[-1]["event"] == "result"
          assert events[-1]["data"]["status"] == "succeeded"
          assert isinstance(events[-1]["data"]["verification"], dict)
          assert isinstance(events[-1]["data"]["usage"], dict)
          assert isinstance(events[-1]["data"]["budgets"], dict)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: agent-core-coverage
          path: coverage.xml

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install --index-url https://pypi.org/simple -e packages/agent_core -e "apps/api[test]"
      # Full style/type cleanup of legacy API code is tracked separately; gate on correctness.
      - run: ruff check --config pyproject.toml --select E9,F63,F7,F82 apps/api/app apps/api/tests
      # Broaden mypy gradually: core, schema, SSE, and the clean service subset are gated.
      - run: >
          mypy --config-file apps/api/mypy.ini --follow-imports=skip
          apps/api/app/core
          apps/api/app/schema
          apps/api/app/router/sse.py
          apps/api/app/service/auth_service.py
          apps/api/app/service/space_service.py
          apps/api/app/service/onboarding_service.py
          apps/api/app/service/stats_service.py
          apps/api/app/service/task_service.py
          apps/api/app/service/knowledge_service.py
      - run: pytest -q
        working-directory: apps/api

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install --index-url https://pypi.org/simple -e "packages/agent_core[dev]"
      - run: pip install --index-url https://pypi.org/simple -r apps/worker/requirements.txt
      - run: pytest -q apps/worker/tests

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit
      - run: npm run lint
      - run: npm test
      - run: npm run build:prod

  offline-evaluation-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --index-url https://pypi.org/simple -e "packages/agent_core[dev]"
      - run: python -m unittest discover -s tests/evals -p "test_*.py"
      - run: python tests/evals/run_scenarios.py --validate-only --output evaluation-manifest.json
      - run: python tests/evals/run_behavioral.py
      - run: python tests/evals/run_offline_gates.py
      # Fixture metrics are provenance for the report pipeline, not a quality score.
      # Behavioral gates above actually run AgentRuntime with ScriptedModel.
      - run: |
          python tests/evals/run_scenarios.py \
            --results tests/evals/fixtures/offline_harness_results.json \
            --output offline-fixture-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: offline-evaluation-gate-evidence
          path: |
            evaluation-manifest.json
            offline-fixture-report.json
            tests/evals/artifacts/offline_report.json
            tests/evals/artifacts/behavioral_report.json

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: pip install --index-url https://pypi.org/simple bandit
      - run: bandit -q -r apps/api/app packages/agent_core/src -lll -ii
      - run: npm audit --omit=dev --audit-level=high
        working-directory: apps/web

  containers:
    runs-on: ubuntu-latest
    needs: [agent-core, api, worker, web, offline-evaluation-gates, security]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose -f infra/docker-compose.yml config --quiet
      - run: docker compose -f infra/docker-compose.yml build api worker web
      - name: Start container smoke stack
        run: |
          if ! docker compose -f infra/docker-compose.yml up -d mysql redis api web prometheus grafana; then
            docker compose -f infra/docker-compose.yml ps -a
            docker compose -f infra/docker-compose.yml logs --no-color mysql redis api web prometheus grafana
            exit 1
          fi
      - run: |
          for attempt in $(seq 1 30); do
            curl --fail http://localhost:8000/health \
              && curl --fail http://localhost:5173/health \
              && curl --fail http://localhost:3000/api/health \
              && docker compose -f infra/docker-compose.yml exec -T prometheus wget -qO- http://localhost:9090/-/ready \
              && exit 0
            sleep 5
          done
          docker compose -f infra/docker-compose.yml logs
          exit 1
      - run: npm ci --no-audit
        working-directory: tests/e2e
      - run: npx playwright install --with-deps chromium
        working-directory: tests/e2e
      - run: npm run test:e2e
        working-directory: tests/e2e
      - if: always()
        run: docker compose -f infra/docker-compose.yml down -v
