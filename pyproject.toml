[project]
name = "zhixiao-agent-workspace"
version = "1.0.0"
requires-python = ">=3.11,<3.13"

[tool.uv.workspace]
members = ["packages/agent_core", "apps/api"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["packages/agent_core/tests", "apps/api/tests", "tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101", "ASYNC109", "ASYNC240"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
