[mypy]
python_version = 3.11
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = false
strict = false

# Gated packages (CI --follow-imports=skip):
#   app/core/          - jobs, config, events, middleware, logging, security, ...
#   app/schema/        - pydantic request/response models
#   app/router/sse.py  - SSE stream endpoint
#   app/service/       - auth, space, onboarding, stats, task, and knowledge subset
#
# Remaining (not yet gated - legacy service/router coupling still noisy):
#   app/router/        - except sse.py (auth/task/platform routers)
#   app/service/       - platform and observability
#   app/model/
#   app/repository/
#   app/main.py
