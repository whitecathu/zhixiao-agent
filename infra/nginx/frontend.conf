# 前端容器内 Nginx 单站点配置（多阶段构建时使用）
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript application/xml text/javascript;

    location /health { return 200 "ok"; access_log off; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d; add_header Cache-Control "public, immutable"; access_log off;
    }
}